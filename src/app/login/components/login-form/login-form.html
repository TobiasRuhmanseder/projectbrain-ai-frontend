<section class="login-form-shell">
  <form class="login-form" aria-label="ProjectBrain AI login">
    <h2>Welcome back</h2>
    <p class="sub">Sign in to continue to your workspace.</p>

    <label class="field" for="email">
      <span>Email</span>
      <input id="email" name="email" type="email" autocomplete="email" value="" />
    </label>

    <label class="field" for="password">
      <span>Password</span>
      <input id="password" name="password" type="password" autocomplete="current-password" value="" />
    </label>

    <div class="form-row">
      <label class="check">
        <input type="checkbox" checked />
        <span>Remember me</span>
      </label>
      <a href="#" aria-label="Reset password">Forgot password?</a>
    </div>

    <button class="pb-button pb-button--primary pb-button--full submit-button" type="submit">
      Sign in
      <span aria-hidden="true">-&gt;</span>
    </button>

    <div class="divider">or continue with</div>

    <div class="sso-actions">
      <button type="button" class="pb-button">
        <span aria-hidden="true">G</span>
        Google
      </button>
      <button type="button" class="pb-button">SSO</button>
    </div>

    <p class="foot">No account yet? <a href="#">Request access</a></p>
  </form>
</section>
